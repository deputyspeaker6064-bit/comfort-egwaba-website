<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - News Management</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f6f4;
    color: #173b2b;
}

header {
    background: #003d27;
    color: white;
    padding: 18px 6%;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: white;
    text-decoration: none;
    font-weight: bold;
    line-height: 1.2;
}

.header-link {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.container {
    width: 92%;
    max-width: 1100px;
    margin: auto;
}

.hero {
    background: #003d27;
    color: white;
    padding: 45px 0;
}

.hero h1 {
    margin: 0 0 8px;
    font-family: Georgia, serif;
    font-size: clamp(35px, 6vw, 55px);
}

.hero p {
    margin: 0;
    color: #dcebe3;
}

main {
    padding: 35px 0 70px;
}

.card {
    background: white;
    padding: 28px;
    border-radius: 10px;
    margin-bottom: 30px;
    box-shadow: 0 6px 25px rgba(0,0,0,.07);
}

.card h2 {
    margin-top: 0;
    color: #003d27;
    font-family: Georgia, serif;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccd8d1;
    border-radius: 6px;
    font-size: 15px;
}

input:focus {
    outline: 2px solid #b8d6c6;
}

button {
    border: 0;
    border-radius: 6px;
    padding: 12px 18px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
}

.publish {
    background: #003d27;
    color: white;
}

.publish:hover {
    background: #075438;
}

.update {
    background: #f2bd24;
    color: #003d27;
}

.cancel {
    background: #e5ece8;
    color: #003d27;
}

.delete {
    background: #b42318;
    color: white;
}

.notice {
    display: none;
    padding: 13px;
    margin-bottom: 20px;
    border-radius: 6px;
}

.notice.show {
    display: block;
}

.success-message {
    background: #e5f5eb;
    color: #075b38;
}

.error-message {
    background: #fde9e7;
    color: #9d2017;
}

.news-item {
    border: 1px solid #dce5df;
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 15px;
    background: #fbfdfc;
}

.news-item h3 {
    margin: 0 0 8px;
    color: #003d27;
    font-family: Georgia, serif;
}

.news-date {
    color: #687970;
    font-size: 13px;
    margin-bottom: 12px;
}

.news-image {
    width: 100%;
    max-width: 300px;
    height: 190px;
    object-fit: cover;
    border-radius: 6px;
    display: block;
    margin-bottom: 15px;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.loading,
.empty {
    color: #687970;
    padding: 15px 0;
}

.small-note {
    color: #687970;
    font-size: 13px;
    margin-top: 6px;
}

@media (max-width: 600px) {

    .card {
        padding: 21px;
    }

    .header-inner {
        gap: 15px;
    }

    .header-link {
        font-size: 13px;
    }

}

</style>

</head>


<body>


<header>

<div class="header-inner">

<a href="index.html" class="logo">
KOGI STATE HOUSE<br>
OF ASSEMBLY
</a>

<a href="news.html" class="header-link">
View News →
</a>

</div>

</header>


<section class="hero">

<div class="container">

<h1>News Management</h1>

<p>
Add new news or update news already published on the website.
</p>

</div>

</section>


<main>

<div class="container">


<section class="card" id="newsManagement">

<h2>📰 Update News</h2>

<div
id="notice"
class="notice"
></div>


<form id="newsForm">

<input
type="hidden"
id="newsId"
>


<div class="form-group">

<label for="title">
News Headline
</label>

<input
type="text"
id="title"
placeholder="Enter the news headline"
required
>

</div>


<div class="form-group">

<label for="date">
News Date
</label>

<input
type="date"
id="date"
required
>

</div>


<div class="form-group">

<label for="image">
News Picture URL
</label>

<input
type="url"
id="image"
placeholder="Paste the direct image URL here"
>

<div class="small-note">
Example: https://i.ibb.co/...
</div>

</div>


<button
type="submit"
class="publish"
id="saveButton"
>
Publish News
</button>


<button
type="button"
class="cancel"
id="cancelButton"
style="display:none;"
>
Cancel Update
</button>

</form>

</section>



<section class="card">

<h2>Published News</h2>

<div id="newsList">

<div class="loading">
Loading news...
</div>

</div>

</section>


</div>

</main>



<script>


/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
"https://dcztvgjnxbbvriftnbuy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dYw9Ebgoieyz4ohJAas7IA_ZYNeU8ZC";


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value) {

return String(value ?? "")
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");

}


function showNotice(message, type) {

const notice =
document.getElementById("notice");

notice.textContent = message;

notice.className =
"notice show " +
(
type === "error"
? "error-message"
: "success-message"
);

}


function clearNotice() {

const notice =
document.getElementById("notice");

notice.textContent = "";

notice.className = "notice";

}


function formatDate(date) {

if (!date) {
return "";
}

const d =
new Date(date + "T00:00:00");

if (Number.isNaN(d.getTime())) {
return date;
}

return d.toLocaleDateString(
"en-NG",
{
year: "numeric",
month: "long",
day: "numeric"
}
);

}


/* =====================================================
   SUPABASE REQUEST
===================================================== */

async function supabaseRequest(
endpoint,
options = {}
) {

const headers = {

"apikey": SUPABASE_KEY,

"Authorization":
"Bearer " + SUPABASE_KEY,

...(options.body
? {
"Content-Type":
"application/json"
}
: {}),

...(options.headers || {})

};


const response =
await fetch(
SUPABASE_URL + endpoint,
{
...options,
headers
}
);


const text =
await response.text();


let data = null;


if (text) {

try {

data = JSON.parse(text);

} catch {

data = text;

}

}


if (!response.ok) {

let message =
"Supabase request failed.";

if (data) {

message =
data.message ||
data.hint ||
data.details ||
(
typeof data === "string"
? data
: message
);

}

throw new Error(message);

}


return data;

}


/* =====================================================
   LOAD NEWS
===================================================== */

async function loadNews() {

const list =
document.getElementById("newsList");

list.innerHTML =
'<div class="loading">Loading news...</div>';


try {

const data =
await supabaseRequest(
"/rest/v1/news?select=*&order=created_at.desc"
);


if (!data || data.length === 0) {

list.innerHTML =
'<div class="empty">No news has been published yet.</div>';

return;

}


list.innerHTML = "";


data.forEach(function(item) {

const article =
document.createElement("article");

article.className =
"news-item";


article.innerHTML = `

<h3>
${escapeHTML(item.title)}
</h3>

<div class="news-date">
${escapeHTML(formatDate(item.date))}
</div>

${
item.image
?
`
<img
src="${escapeHTML(item.image)}"
alt="${escapeHTML(item.title)}"
class="news-image"
onerror="this.style.display='none'"
>
`
:
""
}

<div class="actions">

<button
class="update"
type="button"
onclick="editNews('${escapeHTML(String(item.id))}')"
>
Edit / Update
</button>

<button
class="delete"
type="button"
onclick="deleteNews('${escapeHTML(String(item.id))}')"
>
Delete
</button>

</div>

`;

list.appendChild(article);

});


} catch (error) {

console.error(error);

list.innerHTML = `

<div class="notice show error-message">

Could not load news.

<br><br>

${escapeHTML(error.message)}

</div>

`;

}

}


/* =====================================================
   PUBLISH OR UPDATE NEWS
===================================================== */

document
.getElementById("newsForm")
.addEventListener(
"submit",
async function(event) {

event.preventDefault();


clearNotice();


const id =
document.getElementById("newsId")
.value
.trim();


const title =
document.getElementById("title")
.value
.trim();


const date =
document.getElementById("date")
.value;


const image =
document.getElementById("image")
.value
.trim();


if (!title) {

showNotice(
"Please enter a news headline.",
"error"
);

return;

}


if (!date) {

showNotice(
"Please select the news date.",
"error"
);

return;

}


const payload = {

title: title,

date: date,

image: image || null

};


const button =
document.getElementById("saveButton");


button.disabled = true;


button.textContent =
id
? "Updating..."
: "Publishing...";


try {


if (id) {

/* UPDATE EXISTING NEWS */

await supabaseRequest(

"/rest/v1/news?id=eq." +
encodeURIComponent(id),

{

method: "PATCH",

headers: {

"Prefer":
"return=minimal"

},

body:
JSON.stringify(payload)

}

);


showNotice(
"News updated successfully."
);


} else {

/* PUBLISH NEW NEWS */

await supabaseRequest(

"/rest/v1/news",

{

method: "POST",

headers: {

"Prefer":
"return=minimal"

},

body:
JSON.stringify(payload)

}

);


showNotice(
"News published successfully."
);

}


resetForm();

await loadNews();


} catch (error) {

console.error(error);

showNotice(
"Could not save the news: " +
error.message,
"error"
);


} finally {

button.disabled = false;

button.textContent =
"Publish News";

}

}
);


/* =====================================================
   EDIT NEWS
===================================================== */

async function editNews(id) {

clearNotice();


try {

const data =
await supabaseRequest(

"/rest/v1/news?id=eq." +
encodeURIComponent(id) +
"&select=*"

);


if (!data || !data.length) {

showNotice(
"News item was not found.",
"error"
);

return;

}


const item = data[0];


document.getElementById(
"newsId"
).value =
item.id ?? "";


document.getElementById(
"title"
).value =
item.title ?? "";


document.getElementById(
"date"
).value =
item.date ?? "";


document.getElementById(
"image"
).value =
item.image ?? "";


document.getElementById(
"saveButton"
).textContent =
"Update News";


document.getElementById(
"cancelButton"
).style.display =
"inline-block";


document
.getElementById("newsManagement")
.scrollIntoView({
behavior: "smooth",
block: "start"
});


} catch (error) {

console.error(error);

showNotice(
"Could not load the news: " +
error.message,
"error"
);

}

}


/* =====================================================
   DELETE NEWS
===================================================== */

async function deleteNews(id) {

const confirmed =
window.confirm(
"Are you sure you want to delete this news?"
);


if (!confirmed) {
return;
}


try {

await supabaseRequest(

"/rest/v1/news?id=eq." +
encodeURIComponent(id),

{

method: "DELETE",

headers: {

"Prefer":
"return=minimal"

}

}

);


showNotice(
"News deleted successfully."
);


await loadNews();


} catch (error) {

console.error(error);

showNotice(
"Could not delete the news: " +
error.message,
"error"
);

}

}


/* =====================================================
   RESET FORM
===================================================== */

function resetForm() {

document
.getElementById("newsForm")
.reset();


document.getElementById(
"newsId"
).value = "";


document.getElementById(
"saveButton"
).textContent =
"Publish News";


document.getElementById(
"cancelButton"
).style.display =
"none";


const today =
new Date()
.toISOString()
.slice(0, 10);


document.getElementById(
"date"
).value =
today;

}


document
.getElementById("cancelButton")
.addEventListener(
"click",
function() {

resetForm();

clearNotice();

}
);


/* =====================================================
   START
===================================================== */

document.addEventListener(
"DOMContentLoaded",
async function() {

resetForm();

await loadNews();


/*
   Open directly at the News Management box.
*/

document
.getElementById("newsManagement")
.scrollIntoView({
behavior: "smooth",
block: "start"
});

}
);

</script>

</body>

</html>
